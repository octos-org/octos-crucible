name: scorer

on:
  pull_request:
    paths:
      - "scorers/**"
      - "crates/crucible-cli/src/ctr.rs"
      - "crates/crucible-cli/src/executor/**"
      - ".github/workflows/scorer.yml"
  push:
    branches: [main]
    paths:
      - "scorers/**"
      - "crates/crucible-cli/src/ctr.rs"
      - "crates/crucible-cli/src/executor/**"
      - ".github/workflows/scorer.yml"

permissions:
  contents: read

concurrency:
  group: scorer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scorers/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: install dev deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: shellcheck
        run: shellcheck score.sh image/run.sh test/e2e.sh

  playwright-e2e:
    needs: playwright-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # score.sh starts its containers with `crucible ctr` (Docker backend).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build crucible
        run: cargo build -p crucible-cli --locked
      - name: build scorer image
        run: docker build -t crucible-scorer-playwright:ci scorers/playwright/image
      - name: score fixture app
        env:
          CRUCIBLE: ${{ github.workspace }}/target/debug/crucible
          CRUCIBLE_SCORER_IMAGE: crucible-scorer-playwright:ci
          CRUCIBLE_PRUNE_BUILD_CACHE: "1"
          CRUCIBLE_SCORER_FIREWALL: "1"
        run: scorers/playwright/test/e2e.sh
