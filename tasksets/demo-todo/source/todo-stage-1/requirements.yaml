id: ROOT
name: Todo List - Stage 1
type: FOLDER
dependencies: []
description: This product is a minimal single-page todo list web application served
  at the application home page `/`. Every quoted user-interface name is the exact
  English accessible name of the control. Todos are stored by the application's backend,
  so they are shared by all browser sessions and remain after a page reload. No sign-in,
  accounts, or seed data exist; the list starts empty. Each todo has only a text; texts
  are trimmed of leading and trailing whitespace. This stage covers viewing and adding
  todos; later stages extend the same application.
children:
- id: REQ-1
  name: Todo List
  type: FOLDER
  dependencies: []
  description: The home page shows all todos in the order they were added (oldest
    first) together with a form for adding a new todo. Adding a todo stores it in
    the backend and immediately shows it in the list without a manual reload.
  children:
  - id: REQ-1-1
    name: View the Todo List
    type: ATOMIC
    dependencies: []
    description: |-
      The home page `/` displays a level-1 heading “Todos” and one list (an HTML `ul` or `ol`, ARIA role `list`) whose accessible name is “Todo list” (for example `aria-label="Todo list"`). The list contains exactly one list item (role `listitem`) per stored todo, in the order the todos were added, and each list item visibly shows its todo's text. The list element is present even when there are no todos. Todos are loaded from the backend whenever the page is opened, so after a reload the list shows the same todos as before.
    scenarios:
    - name: 'REQ-1-1: View the Todo List - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'A visitor opens the application home page in a fresh browser session.'
      - keyword: THEN
        content: 'The page displays the level-1 heading “Todos”, a list named “Todo list”,
          a textbox named “New todo”, and a button named “Add”.'
    - name: 'REQ-1-1: View the Todo List - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'A todo `Buy milk` has been added.'
      - keyword: WHEN
        content: 'The visitor reloads the home page.'
      - keyword: THEN
        content: 'The list “Todo list” still contains a list item showing `Buy milk`.'
  - id: REQ-1-2
    name: Add a Todo
    type: ATOMIC
    dependencies:
    - REQ-1-1
    description: |-
      Above the list the home page has one textbox whose accessible name is “New todo” (a visible `<label>` or `aria-label`) and one enabled button whose accessible name is “Add”. The visitor types a text in “New todo” and either clicks “Add” or presses Enter in the textbox. The trimmed text is stored as a new todo in the backend and a new list item showing that text appears at the end of “Todo list”; the textbox is then cleared. If the trimmed text is empty, no todo is created and the page visibly shows the message “Todo text is required”; the message disappears after the next successful add. Duplicate texts are allowed.
    scenarios:
    - name: 'REQ-1-2: Add a Todo - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor is on the home page.'
      - keyword: WHEN
        content: 'The visitor types `Buy milk` in “New todo” and clicks “Add”.'
      - keyword: THEN
        content: 'The list “Todo list” contains a list item showing `Buy milk`, and the
          “New todo” textbox is empty.'
    - name: 'REQ-1-2: Add a Todo - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor is on the home page.'
      - keyword: WHEN
        content: 'The visitor types `Walk the dog` in “New todo” and presses Enter.'
      - keyword: THEN
        content: 'The list “Todo list” contains a list item showing `Walk the dog`, also
          after the page is reloaded.'
    - name: 'REQ-1-2: Add a Todo - Scenario 3'
      steps:
      - keyword: GIVEN
        content: 'The visitor is on the home page.'
      - keyword: WHEN
        content: 'The visitor types only spaces in “New todo” and clicks “Add”.'
      - keyword: THEN
        content: 'The page visibly shows “Todo text is required” and no todo is added.'
