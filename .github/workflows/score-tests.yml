name: score-tests

# The only place test code runs (called by eval.yml and score.yml).
#
# Test material can be untrusted (user-uploaded tasksets), and so are the
# outputs under test. This job therefore holds no platform secret: no
# private key, no Worker token, and a GITHUB_TOKEN with no permissions.
# Its only input is the caller's handoff artifact (written by
# `crucible score-handoff` on the machine with the platform key): the
# tests and checkpoints of the stages to score, re-sealed to a one-run key
# that opens nothing else. That key arrives as a workflow_call secret so
# GitHub masks it, and `crucible score` removes it from the scorer's
# environment. Only score.json (result v2: score, max, fixed-name items)
# and the scoring meters' usage logs leave the job.
#
# One job per replica (matrix): an interactive run takes real time.
#
# Model use (docs/plugins.md §10): when the taskset gives a scoring slot a
# model and the submitter gave a credential, the handoff carries it sealed
# to the same one-run key (cred.sealed). `crucible score` opens it in its
# own process and runs a meter on the sandbox network's host side; plugin
# containers get the meter's address and a dummy key, never the key. Plugins
# that execute taskset files (`runs_taskset_code`) can never get a model
# (registry and taskset checks).
#
# The scorer adds its own walls (docs/scorer-contract.md §5, §7): test
# container non-root, cap-drop ALL, no-new-privileges, no environment, on an
# internal network whose traffic to the host or out of the network is
# dropped (CRUCIBLE_SCORER_FIREWALL=1).

on:
  workflow_call:
    inputs:
      handoff:
        description: "artifact: bin/crucible, scorers/ (plugin dirs), taskset.json, tests/, results/"
        type: string
        required: true
      scores:
        description: "artifact prefix to write: <prefix>-r<N> holding <replica>/<stage>/score.json"
        type: string
        required: true
      matrix:
        description: 'JSON {"replica": [1, 2, ...]}'
        type: string
        default: '{"replica": [1]}'
      runs_on:
        description: 'runner labels, a JSON array (the caller resolves CRUCIBLE_SANDBOX_RUNNER; docs/self-hosted.md)'
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      run_key:
        description: "the handoff's one-run key"
        required: true

permissions: {}

jobs:
  tests:
    name: tests r${{ matrix.replica }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 360
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      H: ${{ github.workspace }}/handoff
    steps:
      # A self-hosted machine keeps its workspace between jobs.
      - name: Clear the workspace
        run: rm -rf "$H"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.handoff }}
          path: ${{ github.workspace }}/handoff

      # Check the machine. Cleanup is scoped to this job's run label (in
      # `step score-tests`); other evaluations on the machine are untouched.
      - name: Machine preflight
        run: |
          set -euo pipefail
          echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT)"
          bash "$H/tools/sandbox-net.sh" preflight

      # `crucible step score-tests`: builds the plugin images the taskset
      # uses (plugins.json), brings up the sandbox network when the handoff
      # carries a model credential (meter port only), and scores. Its step
      # spec lists only the one-run key: it reads nothing else and removes
      # every secret variable from its environment first.
      - name: Run the tests
        env:
          RUN_KEY: ${{ secrets.run_key }}
          REPLICA: ${{ matrix.replica }}
          CRUCIBLE_SCORER_FIREWALL: "1"
          # Pruning clears the whole machine's build cache: fresh machines only.
          CRUCIBLE_PRUNE_BUILD_CACHE: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod 0755 "$H/bin/crucible"
          "$H/bin/crucible" step score-tests --handoff "$H" --replica "$REPLICA" \
            --run-label "score-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-r$REPLICA" --out "$RUNNER_TEMP/scores"

      # Also on failure: then it holds only failure.json (a category).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.scores }}-r${{ matrix.replica }}
          path: ${{ runner.temp }}/scores
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$H"
