name: score

# Quick feedback (app mode): score an uploaded output on one stage of a
# taskset. Inputs as docs/api.md (SCORE_WORKFLOW).
#
#   score     holds the platform key, runs no test or agent code: fetches the
#             sealed upload and the stage's tests blob and re-seals both to a
#             one-run key (`crucible score-handoff`) for score-tests.
#   score-tests  (score-tests.yml) holds no platform secret: runs the
#             stage's interactive runner (if any) and scorer plugin
#             (plugins.json; hidden visibility) on the handoff. Only
#             score.json and the scoring meters' usage logs leave it.
#   publish   the only job with contents: write: builds the manifest
#             (mode app), archives it sealed, commits it in clear to the data
#             branch only if score_public, delivers it to the Worker.
#
# score-tests runs on the runner labels of the repository variable
# CRUCIBLE_SANDBOX_RUNNER (unset = GitHub-hosted), docs/self-hosted.md.
#
# Rules as eval.yml: top-level permissions are empty; inputs are validated by
# `crucible plan-score` and reach shells only through env; actions pinned.

on:
  workflow_dispatch:
    inputs:
      eval_id:
        description: "[a-z0-9][a-z0-9-]{7,63}; empty = dev-<run id>-<attempt>"
        type: string
        default: ""
      artifact_source:
        description: "blob:<sha256> of the sealed upload (a zip)"
        type: string
        required: true
      taskset:
        type: string
        required: true
        default: hello-world
      stage:
        description: "stage number, from 1"
        type: string
        required: true
        default: "1"
      cred_source:
        description: "none | workers-kv | github-secret (development): model credential for scoring slots that use a model"
        type: string
        default: none
      model:
        description: "the submitter's model, for scoring slots that use one (a taskset's model.name wins)"
        type: string
        default: ""
      score_public:
        description: "publish the manifest in clear on the data branch"
        type: string
        default: "false"
      owner:
        description: "<github_id>:<login> of the submitter (optional)"
        type: string
        default: ""
      results_url:
        description: "<worker>/internal/results/<eval_id>; empty = do not report to the Worker"
        type: string
        default: ""

run-name: score ${{ inputs.taskset }} stage ${{ inputs.stage }} ${{ inputs.eval_id }}

permissions: {}

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      eval_id: ${{ steps.plan.outputs.eval_id }}
      artifact_hash: ${{ steps.plan.outputs.artifact_hash }}
      taskset: ${{ steps.plan.outputs.taskset }}
      taskset_path: ${{ steps.plan.outputs.taskset_path }}
      stage: ${{ steps.plan.outputs.stage }}
      stage_id: ${{ steps.plan.outputs.stage_id }}
      cred_source: ${{ steps.plan.outputs.cred_source }}
      model: ${{ steps.plan.outputs.model }}
      score_public: ${{ steps.plan.outputs.score_public }}
      owner: ${{ steps.plan.outputs.owner }}
      results_url: ${{ steps.plan.outputs.results_url }}
      worker_url: ${{ steps.plan.outputs.worker_url }}
      run_key: ${{ steps.handoff.outputs.run_key }}
      sandbox_runner: ${{ steps.plan.outputs.sandbox_runner }}
    env:
      STORE: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /crates/
            /plugins.json
            /config/
            /runners/
            /scorers/
            /tasksets/
            !/tasksets/*/source/
            /tools/

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: crucible-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: |
            crucible-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            crucible-${{ runner.os }}-

      - name: Build crucible
        run: |
          set -euo pipefail
          rustup update stable --no-self-update >/dev/null
          rustup default stable >/dev/null
          cargo build --release --locked -p crucible-cli
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/crucible "$RUNNER_TEMP/bin/crucible"
          echo "CRUCIBLE=$RUNNER_TEMP/bin/crucible" >> "$GITHUB_ENV"

      - name: Validate inputs and plan
        id: plan
        env:
          IN_EVAL_ID: ${{ inputs.eval_id }}
          IN_ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          IN_TASKSET: ${{ inputs.taskset }}
          IN_STAGE: ${{ inputs.stage }}
          IN_CRED_SOURCE: ${{ inputs.cred_source }}
          IN_MODEL: ${{ inputs.model }}
          IN_SCORE_PUBLIC: ${{ inputs.score_public }}
          IN_OWNER: ${{ inputs.owner }}
          IN_RESULTS_URL: ${{ inputs.results_url }}
          IN_WORKER_URL: ${{ vars.CRUCIBLE_WORKER_URL }}
          IN_SANDBOX_RUNNER: ${{ vars.CRUCIBLE_SANDBOX_RUNNER }}
          # Only to fetch a user taskset (u-...) the submitter may use.
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: '"$CRUCIBLE" step plan-score --root .'

      - name: Report status (scoring)
        if: steps.plan.outputs.results_url != ''
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          WORKER_URL: ${{ steps.plan.outputs.worker_url }}
          EVAL_ID: ${{ steps.plan.outputs.eval_id }}
        run: '"$CRUCIBLE" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" status scoring'

      # `crucible step handoff` (app mode): the sealed upload becomes
      # replica 1's checkpoint; tests, checkpoint and (when a scoring slot
      # uses a model) the credential are re-sealed to a one-run key.
      - name: Hand off the stage to score-tests
        id: handoff
        env:
          CRUCIBLE_AGE_KEY: ${{ secrets.CRUCIBLE_AGE_KEY }}
          DEV_MODEL_CRED: ${{ secrets.DEV_MODEL_CRED }}
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HASH: ${{ steps.plan.outputs.artifact_hash }}
          TASKSET_PATH: ${{ steps.plan.outputs.taskset_path }}
          STAGE: ${{ steps.plan.outputs.stage }}
          CRED_SOURCE: ${{ steps.plan.outputs.cred_source }}
          MODEL: ${{ steps.plan.outputs.model }}
          WORKER_URL: ${{ steps.plan.outputs.worker_url }}
          EVAL_ID: ${{ steps.plan.outputs.eval_id }}
        run: |
          set -euo pipefail
          "$CRUCIBLE" step handoff --root . --taskset "$TASKSET_PATH" --stage "$STAGE" \
            --results "$RUNNER_TEMP/results" --app-blob "$HASH" --store "$STORE" \
            --key-out "$RUNNER_TEMP/run.key" --cred-source "$CRED_SOURCE" --model "$MODEL" \
            --eval-id "$EVAL_ID" --worker-url "$WORKER_URL" --out "$RUNNER_TEMP/handoff"
          echo "run_key=$(cat "$RUNNER_TEMP/run.key")" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/run.key"

      # Re-sealed to the one-run key: safe in a public repository's artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: score-handoff
          path: ${{ runner.temp }}/handoff
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskset
          path: tasksets/${{ steps.plan.outputs.taskset }}/taskset.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: score-files
          path: ${{ runner.temp }}/bin/crucible
          retention-days: 3
          if-no-files-found: error

  score-tests:
    needs: score
    permissions: {}
    uses: ./.github/workflows/score-tests.yml
    with:
      handoff: score-handoff
      scores: scores
      runs_on: ${{ needs.score.outputs.sandbox_runner }}
    secrets:
      run_key: ${{ needs.score.outputs.run_key }}

  publish:
    needs: [score, score-tests]
    if: always() && needs.score.outputs.eval_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EVAL_ID: ${{ needs.score.outputs.eval_id }}
      HASH: ${{ needs.score.outputs.artifact_hash }}
      TASKSET_PATH: ${{ needs.score.outputs.taskset_path }}
      STAGE: ${{ needs.score.outputs.stage }}
      STAGE_ID: ${{ needs.score.outputs.stage_id }}
      OWNER: ${{ needs.score.outputs.owner }}
      SCORE_PUBLIC: ${{ needs.score.outputs.score_public }}
      WORKER_URL: ${{ needs.score.outputs.worker_url }}
      STORE: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /tasksets/
            !/tasksets/*/source/
            /tools/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: score-files
          path: ${{ runner.temp }}/files/bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: taskset
          path: tasksets/${{ needs.score.outputs.taskset }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.score-tests.result == 'success'
        with:
          pattern: scores-r*
          merge-multiple: true
          path: ${{ runner.temp }}/files/scores

      # `crucible step publish` (app mode): the manifest, the sealed
      # archive, the data branch (only if score_public) and the Worker.
      - name: Publish
        env:
          CRUCIBLE_AGE_KEY: ${{ secrets.CRUCIBLE_AGE_KEY }}
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS_URL: ${{ needs.score.outputs.results_url }}
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/files/bin/crucible"
          deliver=()
          if [ -n "$RESULTS_URL" ]; then deliver=(--deliver "$WORKER_URL"); fi
          "$RUNNER_TEMP/files/bin/crucible" step publish --root . --mode app --eval-id "$EVAL_ID" \
            --taskset "$TASKSET_PATH" --stage "$STAGE" --app-blob "$HASH" \
            --results "$RUNNER_TEMP/results" --scores "$RUNNER_TEMP/files/scores" \
            --owner "$OWNER" --score-public "$SCORE_PUBLIC" \
            --store "$STORE" --data-branch "${deliver[@]}" --out "$RUNNER_TEMP/publish"

      - name: Report failure to the Worker
        if: failure() && needs.score.outputs.results_url != ''
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          chmod 0755 "$RUNNER_TEMP/files/bin/crucible"
          "$RUNNER_TEMP/files/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" status failed

      - name: Delete the credential
        if: always() && needs.score.outputs.cred_source == 'workers-kv'
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          chmod 0755 "$RUNNER_TEMP/files/bin/crucible"
          "$RUNNER_TEMP/files/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" delete-cred
