name: eval

# One evaluation: an agent package x a model x a taskset, N replicas, the
# stages of the taskset run back to back on one machine per replica.
#
# Each job is a step of the step layer (docs/executors.md): it prepares the
# input directories, passes its secrets, calls `crucible step <name>`, and
# hands the output directory on. The logic lives in crucible, not here.
#
#   setup     validate inputs (crucible step plan), build crucible once
#   generate  per replica: fetch + docker build the agent (no secret on the
#             machine yet) -> fetch the stage inputs (never the tests) ->
#             sandbox network -> crucible run (credential on stdin; meter +
#             egress per stage; container 2g/1cpu/non-root/cap-drop ALL) ->
#             seal checkpoints and logs to the platform key -> artifact
#   score     holds the platform key, runs no agent or test code: re-seals
#             each stage's tests blob and every replica's checkpoint to a
#             one-run key (`crucible step handoff`) for score-tests.
#   score-tests  (score-tests.yml, one job per replica) holds no platform
#             secret: per stage runs the interactive runner (if any) and the
#             scorer plugin (plugins.json; hidden visibility) on the handoff.
#             Only score.json and the scoring meters' usage logs leave it.
#             A slot that uses a model gets the submitter's credential,
#             sealed in the handoff, only inside crucible's meter.
#   publish   the only job with contents: write; runs no agent code:
#             stores the sealed files as blobs, builds the manifest (times
#             from GitHub's job/step timestamps, scores, total_score),
#             packs the submitter's download zip (download password from the
#             Worker credential), archives the manifest sealed, commits it in
#             clear to the data branch only if score_public, delivers it to
#             the Worker and deletes the credential.
#
# Machines: generate and score-tests start containers and run on the
# runner labels of the repository variable CRUCIBLE_SANDBOX_RUNNER (a JSON
# array, e.g. ["self-hosted","linux","x64","magicbook"]; unset = GitHub-hosted
# ubuntu-latest; options.runner "github-hosted" forces GitHub-hosted for one
# run). Every other job stays on GitHub-hosted machines. docs/self-hosted.md.
#
# Worker (docs/api.md): the origin of options.results_url, else the
# repository variable CRUCIBLE_WORKER_URL. Progress (building,
# running:<stage>, scoring) and results are reported only when results_url
# is set (runs the Worker dispatched).
#
# Rules: top-level permissions are empty; inputs are validated by
# `crucible plan` and reach shells only through env; actions are pinned by
# SHA; public logs carry progress and numbers only (agent output goes to the
# sealed agent.log).
#
# workflow_dispatch only works once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      agent_source:
        description: "builtin:<name> | url:<https zip> | git:<https url>@<ref> | blob:<sha256>"
        type: string
        required: true
        default: builtin:octos
      taskset:
        description: "tasksets/<name>"
        type: string
        required: true
        default: arcbench-github
      model:
        type: string
        required: true
        default: glm-5.3-flash
      endpoint:
        description: "OpenAI-compatible base URL (https); empty = the one stored with the credential"
        type: string
        default: ""
      replicas:
        type: string
        default: "1"
      cred_source:
        description: "github-secret (development) | workers-kv"
        type: string
        default: github-secret
      eval_id:
        description: "[a-z0-9][a-z0-9-]{7,63}; empty = dev-<run id>-<attempt>"
        type: string
        default: ""
      score_public:
        description: "publish the manifest in clear on the data branch"
        type: boolean
        default: false
      owner:
        description: "<github_id>:<login> of the submitter (optional)"
        type: string
        default: ""
      options:
        description: 'JSON, all optional: {"stages": N (first N stages only), "budget": {"max_requests","max_tokens","max_cost_usd","price"}, "results_url": "https://...", "agent_ref": "<branch or tag of the upstream repo of a builtin agent>", "runner": "sandbox" (CRUCIBLE_SANDBOX_RUNNER) | "github-hosted"}'
        type: string
        default: ""

run-name: eval ${{ inputs.taskset }} ${{ inputs.model }} ${{ inputs.eval_id }}

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      agent_source: ${{ steps.plan.outputs.agent_source }}
      agent_kind: ${{ steps.plan.outputs.agent_kind }}
      agent_ref: ${{ steps.plan.outputs.agent_ref }}
      model: ${{ steps.plan.outputs.model }}
      endpoint: ${{ steps.plan.outputs.endpoint }}
      cred_source: ${{ steps.plan.outputs.cred_source }}
      budget: ${{ steps.plan.outputs.budget }}
      taskset: ${{ steps.plan.outputs.taskset }}
      taskset_path: ${{ steps.plan.outputs.taskset_path }}
      stages: ${{ steps.plan.outputs.stages }}
      run_timeout_min: ${{ steps.plan.outputs.run_timeout_min }}
      eval_id: ${{ steps.plan.outputs.eval_id }}
      score_public: ${{ steps.plan.outputs.score_public }}
      owner: ${{ steps.plan.outputs.owner }}
      results_url: ${{ steps.plan.outputs.results_url }}
      worker_url: ${{ steps.plan.outputs.worker_url }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sandbox_runner: ${{ steps.plan.outputs.sandbox_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: crucible-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: |
            crucible-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            crucible-${{ runner.os }}-

      - name: Build crucible
        run: |
          set -euo pipefail
          rustup update stable --no-self-update >/dev/null
          rustup default stable >/dev/null
          cargo build --release --locked -p crucible-cli
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/crucible "$RUNNER_TEMP/bin/crucible"

      - name: Validate inputs and plan
        id: plan
        env:
          IN_AGENT_SOURCE: ${{ inputs.agent_source }}
          IN_TASKSET: ${{ inputs.taskset }}
          IN_MODEL: ${{ inputs.model }}
          IN_ENDPOINT: ${{ inputs.endpoint }}
          IN_REPLICAS: ${{ inputs.replicas }}
          IN_CRED_SOURCE: ${{ inputs.cred_source }}
          IN_EVAL_ID: ${{ inputs.eval_id }}
          IN_SCORE_PUBLIC: ${{ inputs.score_public }}
          IN_OWNER: ${{ inputs.owner }}
          IN_OPTIONS: ${{ inputs.options }}
          IN_WORKER_URL: ${{ vars.CRUCIBLE_WORKER_URL }}
          IN_SANDBOX_RUNNER: ${{ vars.CRUCIBLE_SANDBOX_RUNNER }}
          # Only to fetch a user taskset (u-...) the submitter may use.
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          # The agent source may be a signed URL: keep it out of the log.
          "$RUNNER_TEMP/bin/crucible" step plan --root . 2>&1 | grep -v '^agent_source=' || exit 1

      - name: Report status (building)
        if: steps.plan.outputs.results_url != ''
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          WORKER_URL: ${{ steps.plan.outputs.worker_url }}
          EVAL_ID: ${{ steps.plan.outputs.eval_id }}
        run: |
          "$RUNNER_TEMP/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" status building

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crucible-bin
          path: ${{ runner.temp }}/bin/crucible
          retention-days: 1
          if-no-files-found: error

      # The taskset.json every later job reads (a user taskset is not in the
      # repository; `crucible plan` fetched it from the Worker).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskset
          path: tasksets/${{ steps.plan.outputs.taskset }}/taskset.json
          retention-days: 1
          if-no-files-found: error

  generate:
    needs: setup
    name: generate r${{ matrix.replica }}
    runs-on: ${{ fromJSON(needs.setup.outputs.sandbox_runner) }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      REPLICA: ${{ matrix.replica }}
      AGENT_SOURCE: ${{ needs.setup.outputs.agent_source }}
      MODEL: ${{ needs.setup.outputs.model }}
      ENDPOINT: ${{ needs.setup.outputs.endpoint }}
      CRED_SOURCE: ${{ needs.setup.outputs.cred_source }}
      BUDGET: ${{ needs.setup.outputs.budget }}
      TASKSET_PATH: ${{ needs.setup.outputs.taskset_path }}
      STAGES: ${{ needs.setup.outputs.stages }}
      EVAL_ID: ${{ needs.setup.outputs.eval_id }}
      WORKER_URL: ${{ needs.setup.outputs.worker_url }}
      RESULTS_URL: ${{ needs.setup.outputs.results_url }}
      STORE: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # tasksets/*/source/ holds public placeholder tasks in clear,
          # tests included: never on the generation machine.
          sparse-checkout: |
            /agents/
            /config/
            /tasksets/
            !/tasksets/*/source/
            /tools/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crucible-bin
          path: ${{ runner.temp }}/bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: taskset
          path: tasksets/${{ needs.setup.outputs.taskset }}

      # Check the machine. Cleanup is scoped: `step generate` removes what
      # carries this replica's run label (an earlier attempt's leftovers)
      # and never touches other evaluations on the same machine.
      - name: Machine preflight
        run: |
          set -euo pipefail
          echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT)"
          tools/sandbox-net.sh preflight

      # `crucible step generate` (docs/executors.md): fetch + build the
      # agent, fetch the stage inputs (never the tests; it refuses test
      # material in the checkout or the inputs), sandbox network up and
      # checked, the credential opened in its own process only, the stages,
      # then every output sealed; only sealed files are left in results/.
      - name: Run agent stages
        env:
          DEV_MODEL_CRED: ${{ secrets.DEV_MODEL_CRED }}
          CRUCIBLE_AGE_KEY: ${{ secrets.CRUCIBLE_AGE_KEY }}
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_REF: ${{ needs.setup.outputs.agent_ref }}
          RUN_TIMEOUT_MIN: ${{ needs.setup.outputs.run_timeout_min }}
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          progress=()
          if [ -n "$RESULTS_URL" ]; then progress=(--report-progress); fi
          "$RUNNER_TEMP/bin/crucible" step generate --root . --taskset "$TASKSET_PATH" \
            --agent-source "$AGENT_SOURCE" --agent-ref "$AGENT_REF" \
            --model "$MODEL" --endpoint "$ENDPOINT" --budget "$BUDGET" \
            --stages "$STAGES" --replica "$REPLICA" --cred-source "$CRED_SOURCE" \
            --eval-id "$EVAL_ID" --worker-url "$WORKER_URL" "${progress[@]}" \
            --store "$STORE" --run-timeout-min "$RUN_TIMEOUT_MIN" \
            --image-tag "crucible-agent-$EVAL_ID:r$REPLICA" \
            --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/results"

      # The step empties its work dir and removes its image and containers
      # itself; this only covers a step that was killed.
      - name: Remove the work dir
        if: always()
        run: rm -rf "$RUNNER_TEMP/work" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gen-r${{ matrix.replica }}
          path: ${{ runner.temp }}/results
          retention-days: 3
          if-no-files-found: warn

  score:
    needs: [setup, generate]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      run_key: ${{ steps.handoff.outputs.run_key }}
    env:
      EVAL_ID: ${{ needs.setup.outputs.eval_id }}
      TASKSET_PATH: ${{ needs.setup.outputs.taskset_path }}
      STAGES: ${{ needs.setup.outputs.stages }}
      WORKER_URL: ${{ needs.setup.outputs.worker_url }}
      MODEL: ${{ needs.setup.outputs.model }}
      ENDPOINT: ${{ needs.setup.outputs.endpoint }}
      CRED_SOURCE: ${{ needs.setup.outputs.cred_source }}
      BUDGET: ${{ needs.setup.outputs.budget }}
      STORE: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /runners/
            /scorers/
            /tasksets/
            !/tasksets/*/source/
            /tools/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crucible-bin
          path: ${{ runner.temp }}/bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: taskset
          path: tasksets/${{ needs.setup.outputs.taskset }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gen-r*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      - name: Report status (scoring)
        if: needs.setup.outputs.results_url != ''
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          "$RUNNER_TEMP/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" status scoring

      # `crucible step handoff`: tests, checkpoints and (when a scoring slot
      # uses a model) the credential re-sealed to a one-run key, plus what
      # score-tests runs (crucible, plugins, prices).
      - name: Hand off the stages to score-tests
        id: handoff
        env:
          CRUCIBLE_AGE_KEY: ${{ secrets.CRUCIBLE_AGE_KEY }}
          DEV_MODEL_CRED: ${{ secrets.DEV_MODEL_CRED }}
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          "$RUNNER_TEMP/bin/crucible" step handoff --root . --taskset "$TASKSET_PATH" --stages "$STAGES" \
            --results "$RUNNER_TEMP/results" --store "$STORE" --key-out "$RUNNER_TEMP/run.key" \
            --cred-source "$CRED_SOURCE" --model "$MODEL" --endpoint "$ENDPOINT" --budget "$BUDGET" \
            --eval-id "$EVAL_ID" --worker-url "$WORKER_URL" --out "$RUNNER_TEMP/handoff"
          echo "run_key=$(cat "$RUNNER_TEMP/run.key")" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/run.key"

      # Re-sealed to the one-run key: safe in a public repository's artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: score-handoff
          path: ${{ runner.temp }}/handoff
          retention-days: 1
          if-no-files-found: error

  score-tests:
    needs: [setup, score]
    permissions: {}
    uses: ./.github/workflows/score-tests.yml
    with:
      handoff: score-handoff
      scores: scores
      matrix: ${{ needs.setup.outputs.matrix }}
      runs_on: ${{ needs.setup.outputs.sandbox_runner }}
    secrets:
      run_key: ${{ needs.score.outputs.run_key }}

  publish:
    needs: [setup, generate, score, score-tests]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      EVAL_ID: ${{ needs.setup.outputs.eval_id }}
      MODEL: ${{ needs.setup.outputs.model }}
      TASKSET_PATH: ${{ needs.setup.outputs.taskset_path }}
      STAGES: ${{ needs.setup.outputs.stages }}
      MATRIX: ${{ needs.setup.outputs.matrix }}
      OWNER: ${{ needs.setup.outputs.owner }}
      SCORE_PUBLIC: ${{ needs.setup.outputs.score_public }}
      RESULTS_URL: ${{ needs.setup.outputs.results_url }}
      WORKER_URL: ${{ needs.setup.outputs.worker_url }}
      CRED_SOURCE: ${{ needs.setup.outputs.cred_source }}
      BUDGET: ${{ needs.setup.outputs.budget }}
      STORE: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/
            /tasksets/
            !/tasksets/*/source/
            /tools/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crucible-bin
          path: ${{ runner.temp }}/bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: taskset
          path: tasksets/${{ needs.setup.outputs.taskset }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gen-r*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      # One artifact per replica; a replica whose scoring job failed has
      # only failure.json (its category), and its stages stay unscored.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.score.result == 'success'
        continue-on-error: true
        with:
          pattern: scores-r*
          merge-multiple: true
          path: ${{ runner.temp }}/scores

      # `crucible step publish`: sealed outputs stored as blobs, the
      # manifest (wall times from GitHub's own job and step timestamps), the
      # download zip (workers-kv), the sealed archive, the data branch (only
      # if score_public) and the Worker.
      - name: Publish
        env:
          CRUCIBLE_AGE_KEY: ${{ secrets.CRUCIBLE_AGE_KEY }}
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          extra=()
          if [ "$CRED_SOURCE" = workers-kv ]; then extra+=(--download-zip "$WORKER_URL"); fi
          if [ -n "$RESULTS_URL" ]; then extra+=(--deliver "$WORKER_URL"); fi
          "$RUNNER_TEMP/bin/crucible" step publish --root . --mode agent --eval-id "$EVAL_ID" \
            --taskset "$TASKSET_PATH" --stages "$STAGES" --model "$MODEL" \
            --replicas "$(jq '.replica | length' <<< "$MATRIX")" \
            --results "$RUNNER_TEMP/results" --scores "$RUNNER_TEMP/scores" \
            --owner "$OWNER" --score-public "$SCORE_PUBLIC" --budget "$BUDGET" \
            --store "$STORE" --github-jobs --data-branch "${extra[@]}" --out "$RUNNER_TEMP/publish"

      - name: Report failure to the Worker
        if: failure() && needs.setup.outputs.results_url != ''
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          "$RUNNER_TEMP/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" status failed

      # The model key and download password are deleted when the run ends,
      # whatever happened (KV also expires them after 24 h).
      - name: Delete the credential
        if: always() && needs.setup.outputs.cred_source == 'workers-kv'
        env:
          CRUCIBLE_WORKER_TOKEN: ${{ secrets.CRUCIBLE_WORKER_TOKEN }}
        run: |
          chmod 0755 "$RUNNER_TEMP/bin/crucible"
          "$RUNNER_TEMP/bin/crucible" worker --worker-url "$WORKER_URL" --eval-id "$EVAL_ID" delete-cred
