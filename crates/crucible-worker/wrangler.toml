# Cloudflare Worker: octos-crucible backend. Deployment steps: docs/api.md.
name = "crucible-worker"
main = "build/index.js"
compatibility_date = "2026-09-01"

[build]
# Needs `cargo install worker-build --version 0.8.6 --locked` and the
# wasm32-unknown-unknown target.
command = "worker-build --release"

# Records (evals, results, uploads, tasksets, tokens, bans, caches). Schema:
# migrations/*.sql, applied by `wrangler d1 migrations apply octos-crucible`.
[[d1_databases]]
binding = "CRUCIBLE_DB"
database_name = "octos-crucible"
database_id = "7d2b7485-932b-44e0-a57f-e47c83651855"
migrations_dir = "migrations"

# Only the sealed model credential (24 h TTL); also read once by the
# KV -> D1 migration (POST /internal/migrate-kv).
[[kv_namespaces]]
binding = "CRUCIBLE_KV"
# `wrangler kv namespace create CRUCIBLE_KV` prints the id to put here.
id = "fe1bef190c3c4a6cbbe7917e68705863"

[vars]
PAGES_ORIGIN = "https://octos-org.github.io"
PAGES_URL = "https://octos-org.github.io/octos-crucible/"
GITHUB_REPO = "octos-org/octos-crucible"
# Comma-separated GitHub numeric user ids.
ADMIN_GITHUB_IDS = "58540850"
# Optional:
WORKER_URL = "https://crucible-worker.stratosphericus.workers.dev"
# EVAL_WORKFLOW = "eval.yml"
# SCORE_WORKFLOW = "score.yml"
# EVAL_REF = "main"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET   (GitHub OAuth App)
#   GITHUB_TOKEN                             (fine-grained: contents:write, actions:write, this repo only)
#   SESSION_HMAC_KEY                         (>= 32 random bytes)
#   CRUCIBLE_WORKER_TOKEN                    (>= 32 chars; same value as the Actions secret)
#
# Local only (`.dev.vars`, see .dev.vars.example): DEV_AUTH=1 enables
# /auth/dev-login and GITHUB_API_BASE / GITHUB_WEB_BASE overrides, honoured
# for requests to localhost only.
